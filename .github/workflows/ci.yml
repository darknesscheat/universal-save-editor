name: CI

on:
  push:
    branches: [main]
  pull_request:

# Anything touching the write path has to prove itself on every platform the
# app claims to support: path handling and atomic rename are exactly the parts
# that differ between them.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check the frontend
        run: npx tsc --noEmit

      - name: Test the core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint the core
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check